<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Login Ultra Moderno</title>
    <style>
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-aurora {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: aurora 15s ease infinite;
        }
    </style>
</head>
<body class="animate-aurora min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="bg-white/70 backdrop-blur-2xl border border-white/40 shadow-[0_20px_50px_rgba(0,0,0,0.2)] rounded-[2.5rem] w-full max-w-md p-10 relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500"></div>

        <div class="text-center mb-10">
            <h2 class="text-4xl font-extrabold text-gray-800 tracking-tight">¡Hola de nuevo!</h2>
            <p class="text-gray-500 mt-2 font-medium">Nos alegra verte otra vez.</p>
        </div>

        <form action="#" class="space-y-5">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="mail" class="w-5 h-5 text-gray-400"></i>
                </div>
                <input type="email" placeholder="Correo electrónico" 
                    class="w-full pl-12 pr-4 py-4 rounded-2xl bg-white/50 border border-gray-200 focus:border-purple-400 focus:ring-4 focus:ring-purple-100 outline-none transition-all text-gray-700 placeholder:text-gray-400 shadow-sm">
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i data-lucide="lock" class="w-5 h-5 text-gray-400"></i>
                </div>
                <input type="password" placeholder="Tu contraseña" 
                    class="w-full pl-12 pr-12 py-4 rounded-2xl bg-white/50 border border-gray-200 focus:border-purple-400 focus:ring-4 focus:ring-purple-100 outline-none transition-all text-gray-700 placeholder:text-gray-400 shadow-sm">
                <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-purple-500">
                    <i data-lucide="eye" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex justify-end">
                <a href="#" class="text-sm font-semibold text-purple-600 hover:text-purple-700 transition-colors">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" 
                class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-purple-200 hover:bg-gray-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Ingresar
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-200"></span></div>
            <div class="relative flex justify-center text-xs uppercase"><span class="bg-white/0 px-2 text-gray-400 font-bold tracking-widest leading-none">O accede con</span></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 bg-white/50 hover:bg-white hover:shadow-md transition-all font-semibold text-gray-600">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                Google
            </button>
            <button class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl border border-gray-200 bg-white/50 hover:bg-white hover:shadow-md transition-all font-semibold text-gray-600">
                <i data-lucide="github" class="w-5 h-5"></i>
                GitHub
            </button>
        </div>

        <p class="text-center mt-10 text-gray-500 font-medium">
            ¿No tienes cuenta? 
            <a href="#" class="text-purple-600 font-bold hover:underline">Crea una aquí</a>
        </p>
    </div>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
